  optional DeviceRole role = 7;
  optional Tenant tenant = 8;
  optional Platform platform = 9;
  optional IPAddress primary_ip4 = 10;
  optional IPAddress primary_ip6 = 11;
  optional double vcpus = 12;
  optional int64 memory = 13;
  optional int64 disk = 14;
  optional string description = 15;
  optional string comments = 16;
  repeated Tag tags = 17;
  map<string, CustomFieldValue> custom_fields = 18;
}

message WirelessLAN {
  string ssid = 1;
  optional string description = 2;
  optional WirelessLANGroup group = 3;
  optional string status = 4 [(validate.rules).string = { in: ["active","deprecated","disabled","reserved"] }];
  optional VLAN vlan = 5;
  oneof scope {
    Location scope_location = 6;
    Region scope_region = 7;
    Site scope_site = 8;
    SiteGroup scope_site_group = 9;
  }
  optional Tenant tenant = 10;
  optional string auth_type = 11 [(validate.rules).string = { in: ["open","wep","wpa-enterprise","wpa-personal"] }];
  optional string auth_cipher = 12 [(validate.rules).string = { in: ["aes","auto","tkip"] }];
  optional string auth_psk = 13;
  optional string comments = 14;
  repeated Tag tags = 15;
  map<string, CustomFieldValue> custom_fields = 16;
}

message WirelessLANGroup {
  string name = 1;
  string slug = 2;
  optional WirelessLANGroup parent = 3;
  optional string description = 4;
  repeated Tag tags = 5;
  map<string, CustomFieldValue> custom_fields = 6;
}

message WirelessLink {
  Interface interface_a = 1;
  Interface interface_b = 2;
  optional string ssid = 3;
  optional string status = 4 [(validate.rules).string = { in: ["connected","decommissioning","planned"] }];
  optional Tenant tenant = 5;
  optional string auth_type = 6 [(validate.rules).string = { in: ["open","wep","wpa-enterprise","wpa-personal"] }];
  optional string auth_cipher = 7 [(validate.rules).string = { in: ["aes","auto","tkip"] }];
  optional string auth_psk = 8;
  optional double distance = 9;
  optional string distance_unit = 10 [(validate.rules).string = { in: ["ft","km","m","mi"] }];
  optional string description = 11;
  optional string comments = 12;
  repeated Tag tags = 13;
  map<string, CustomFieldValue> custom_fields = 14;
}
