syntax = "proto3";

package diode.v1;

import "diode/v1/ingester.proto";
import "google/protobuf/struct.proto";
import "validate/validate.proto";

option go_package = "github.com/netboxlabs/diode/diode-server/gen/diode/v1/reconcilerpb";

enum State {
  STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  OPEN = 2;
  APPLIED = 3;
  FAILED = 4;
  NO_CHANGES = 5;
  IGNORED = 6;
  ERRORED = 7;
}

// Ingestion metrics
message IngestionMetrics {
  int32 total = 1;
  int32 queued = 2;
  int32 reconciled = 3;
  int32 failed = 4;
  int32 no_changes = 5;
}

// A change set
message ChangeSet {
  string id = 1; // A change set ID
  bytes data = 2; // Binary data representing the change set
  optional string branch_id = 3; // branch ID against which the change set was generated
  optional string deviation_name = 4; // deviation name
}

// An ingestion log
message IngestionLog {
  string id = 1;
  string data_type = 2 [deprecated = true];
  State state = 3;
  string request_id = 4;
  int64 ingestion_ts = 5;
  string producer_app_name = 6;
  string producer_app_version = 7;
  string sdk_name = 8;
  string sdk_version = 9;
  diode.v1.Entity entity = 10;
  DeviationError error = 11;
  ChangeSet change_set = 12;
  string object_type = 13;
  int64 source_ts = 14;
}

// The request to retrieve ingestion logs
message RetrieveIngestionLogsRequest {
  optional int32 page_size = 1; // Number of logs per page, default is 100
  optional State state = 2; // Optional filter by state field
  string data_type = 3 [deprecated = true]; // Optional filter by data type field
  string request_id = 4; // Optional filter by request ID
  int64 ingestion_ts_start = 5; // Optional start of ingestion timestamp range
  int64 ingestion_ts_end = 6; // Optional end of ingestion timestamp range
  string page_token = 7; // Token to fetch the next page of results
  bool only_metrics = 8; // Flag to return only the ingestion metrics
  string object_type = 9; // Optional filter by object type
}

// The response from the retrieve ingestion logs request
message RetrieveIngestionLogsResponse {
  repeated IngestionLog logs = 1; // List of ingestion logs
  IngestionMetrics metrics = 2; // ingestion metrics
  string next_page_token = 3; // Token for the next page of results, if any
}

// The request to retrieve deviations
message RetrieveDeviationsRequest {
  optional int32 page_size = 1; // Number of deviations per page, default is 100
  string page_token = 2; // Token to fetch the next page of results
  int64 ingestion_ts_start = 3; // Optional start of ingestion timestamp range
  int64 ingestion_ts_end = 4; // Optional end of ingestion timestamp range
  repeated State state = 5; // Optional filter by states
  repeated string object_type = 6; // Optional filter by object types
  repeated string branch_id = 7; // Optional filter by branch IDs
}

// Deviation error
message DeviationError {
  string message = 1;
  string code = 2;
  bytes details = 3;
}

// A change
message Change {
  string id = 1;
  string object_type = 2;
  string object_primary_value = 3;
  string change_type = 4;
  bytes before = 5;
  bytes after = 6;
}

// A deviation
message Deviation {
  string id = 1;
  int64 ingestion_ts = 2;
  int64 last_update_ts = 3;
  string name = 4;
  string source = 5;
  State state = 6;
  string object_type = 7;
  optional string branch_id = 8;
  diode.v1.Entity ingested_entity = 9;
  DeviationError error = 10;
  repeated Change changes = 11;
  int64 source_ts = 12;
}

// The response from the retrieve deviations request
message RetrieveDeviationsResponse {
  repeated Deviation deviations = 1; // List of deviations
  string next_page_token = 2; // Token for the next page of results, if any
}

// The request to retrieve deviation by ID
message RetrieveDeviationByIDRequest {
  string id = 1; // Deviation ID
}

// The response from the retrieve deviation by ID request
message RetrieveDeviationByIDResponse {
  Deviation deviation = 1; // Deviation
}

// The request to list results by job
message ListResultsByJobRequest {
  repeated string job_id = 1; // Filter by job IDs from source_metadata
  optional int32 page_size = 2; // Number of results per page, default is 100, max 1000
  string page_token = 3; // Token to fetch the next page of results
  repeated State state = 4; // Optional filter by states
  repeated string object_type = 5; // Optional filter by object types
  repeated string branch_id = 6; // Optional filter by branch IDs
  int64 ingestion_ts_start = 7; // Optional start of ingestion timestamp range
  int64 ingestion_ts_end = 8; // Optional end of ingestion timestamp range
}

// The response from the list results by job request
message ListResultsByJobResponse {
  repeated Deviation deviations = 1; // List of deviations for the job(s)
  string next_page_token = 2; // Token for the next page of results, if any
}

// An observed entity with its metadata
message DiodeEntity {
  string id = 1; // Diode entity ID (UUID)
  string object_type = 2; // Entity type (e.g., "dcim.device")
  int64 ingestion_ts = 3; // When the entity was ingested
  int64 source_ts = 4; // Timestamp from the entity source
  diode.v1.Entity entity = 5; // The actual entity data
  google.protobuf.Struct source_metadata = 6; // Metadata (agent_id, policy_id, job_id, etc.)
  int64 created_at = 7; // When first created in Diode
  int64 updated_at = 8; // When last updated
  int64 last_seen_ts = 9; // When entity was last seen/ingested
  int32 duplicate_count = 10; // Number of times this entity was re-ingested
}

// Request to list entities with optional filters
message ListEntitiesRequest {
  optional int32 page_size = 1; // Number of entities per page (default 100, max 1000)
  string page_token = 2; // Token to fetch the next page

  // Flexible metadata filter - matches all provided key-value pairs
  // Example: {"agent_id": "agent-123", "policy_id": "policy-456"}
  google.protobuf.Struct metadata_filters = 3;

  // Standard filters
  repeated string object_type = 4; // Filter by object types
  optional int64 ingestion_ts_start = 5; // Filter by ingestion timestamp range start
  optional int64 ingestion_ts_end = 6; // Filter by ingestion timestamp range end
}

// Response from the list entities request
message ListEntitiesResponse {
  repeated DiodeEntity entities = 1; // List of entities
  string next_page_token = 2; // Token for the next page, if any
}

// Request to create an entity in the graph database (idempotent)
message CreateEntityRequest {
  diode.v1.Entity entity = 1 [(validate.rules).message.required = true]; // The entity to create
  google.protobuf.Struct metadata = 2; // Optional metadata (agent_id, policy_id, etc.)
}

// Response from creating an entity
message CreateEntityResponse {
  string id = 1; // Diode entity ID (UUID)
  string object_type = 2; // Entity type
}

// Reconciler service API
service ReconcilerService {
  // Retrieves ingestion logs
  rpc RetrieveIngestionLogs(RetrieveIngestionLogsRequest) returns (RetrieveIngestionLogsResponse) {
    option deprecated = true;
  }

  // Retrieve deviations
  rpc RetrieveDeviations(RetrieveDeviationsRequest) returns (RetrieveDeviationsResponse);

  // Retrieve deviation by ID
  rpc RetrieveDeviationByID(RetrieveDeviationByIDRequest) returns (RetrieveDeviationByIDResponse);

  // List observed entities with filtering
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);

  // Create an entity synchronously in the graph database (idempotent - returns existing ID if entity already exists)
  rpc CreateEntity(CreateEntityRequest) returns (CreateEntityResponse);

  // List results filtered by job ID
  rpc ListResultsByJob(ListResultsByJobRequest) returns (ListResultsByJobResponse);
}
