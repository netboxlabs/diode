version: "2"
sql:
  - engine: "postgresql"
    schema: "dbstore/postgres/migrations"
    queries: "dbstore/postgres/queries"
    gen:
      go:
        out: "gen/dbstore/postgres"
        package: "postgres"
        sql_package: "pgx/v5"
        output_models_file_name: "types.go"
        emit_json_tags: true
        overrides:
          - column: v_deviations.change_set
            go_type:
              type: ChangeSet
              pointer: true
          - column: changes.before
            go_type:
              type: any
          - column: changes.after
            go_type:
              type: any
