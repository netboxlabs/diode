name: ${PROJECT_NAME:-diode}
services:
  diode-reconciler:
    extra_hosts:
    - "host.docker.internal:host-gateway"
  redis-commander:
    hostname: redis-commander
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    environment:
    - REDIS_HOSTS=local:$REDIS_HOST:$REDIS_PORT:0:$REDIS_PASSWORD
    ports:
    - "8082:8081"