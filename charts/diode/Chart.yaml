apiVersion: v2
name: diode
description: A Helm chart for Diode
type: application
version: "1.9.1"
appVersion: "1.5.0"
home: https://github.com/netboxlabs/diode
sources:
  - https://github.com/netboxlabs/diode
maintainers:
  - name: NetBox Labs
    email: support@netboxlabs.com
    url: https://github.com/netboxlabs
keywords:
  - diode
  - netbox
  - assurance
dependencies:
  - name: common
    version: 2.31.1
    repository: https://charts.bitnami.com/bitnami
  - name: redis
    version: 20.11.5
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: 16.6.3
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: hydra
    version: 0.53.0
    repository: https://k8s.ory.sh/helm/charts
    condition: hydra.enabled
  - name: ingress-nginx
    version: 4.12.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingressNginx.controller.enabled
  - name: cert-manager
    version: v1.12.0
    repository: https://charts.jetstack.io
    condition: certManager.enabled
