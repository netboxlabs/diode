{{- if and .Values.hydra.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "diode.hydra.extrainitcontainerconfigmap" . }}
  # Consumed by the hydra subchart, which does not follow namespaceOverride.
  # ConfigMap references are namespace-scoped, so this has to sit alongside
  # its consumer in the release namespace.
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diode.labels" . | nindent 4 }}
  {{- if .Values.global.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.global.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  POSTGRES_HOST: {{ include "diode.postgresql.hostname" . | quote }}
  POSTGRES_PORT: {{ include "diode.postgresql.port" . | quote }}
{{- end }}
