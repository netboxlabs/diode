{{- if and .Values.diodeAuth.enabled .Values.diodeAuth.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "diode.auth.serviceaccountname" . }}
  namespace: {{ include "diode.namespace" . }}
  labels:
    {{- include "diode.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "diode.auth.servicename" . }}
{{- end }} 
