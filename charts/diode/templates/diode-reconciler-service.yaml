{{- if .Values.diodeReconciler.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "diode.reconciler.servicename" . }}
  namespace: {{ include "diode.namespace" . }}
  labels:
    {{- include "diode.labels" . | nindent 4 }}
    app: {{ include "diode.reconciler.servicename" . }}
    app.kubernetes.io/component: {{ include "diode.reconciler.servicename" . }}
  {{- if .Values.global.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.global.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "diode.reconciler.servicename" . }}
  ports:
    - name: grpc
      port: {{ .Values.diodeReconciler.containerPort }}
      targetPort: {{ .Values.diodeReconciler.containerPort }}
      protocol: TCP
{{- end }}
