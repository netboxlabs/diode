{{- if .Values.certIssuer.enabled -}}
apiVersion: cert-manager.io/v1
kind: {{ .Values.certIssuer.kind }}
metadata:
  name: {{ include "diode.name" . }}-letsencrypt
  namespace: {{ include "diode.namespace" . }}
  labels:
    {{- include "diode.labels" . | nindent 4 }}
spec:
  acme:
    # The ACME server URL
    server: "https://acme-{{- if not (eq .Values.diode.environment "production") }}staging-{{- end }}v02.api.letsencrypt.org/directory"
    # Email address used for ACME registration
    email: {{ .Values.certIssuer.email }}
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: {{ .Values.certIssuer.name }}
    # Enable the HTTP-01 challenge provider
    solvers:
    - http01:
        ingress:
          class: {{ .Values.ingressNginx.ingressClass | default "nginx" }}
{{- end }}
