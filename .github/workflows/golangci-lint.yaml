name: Go - lint
on:
  push:
    branches:
      - "!release"
    paths:
      - "diode-server/**"
  pull_request:
    paths:
      - "diode-server/**"

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          check-latest: true
      - name: Lint
        uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08da042db8 # v6
        with:
          version: v1.62
          working-directory: diode-server
          args: --config ../.github/golangci.yaml
